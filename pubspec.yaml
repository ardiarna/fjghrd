name: fjghrd
description: "HRD Fratekindo Application"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.2.1+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  currency_text_input_formatter: ^2.3.0
  dotted_border: ^3.1.0
  fl_chart: ^1.2.0
  get: ^4.7.3
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  mime: ^2.0.0
  path_provider: ^2.1.5
  pluto_grid: ^8.1.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  google_fonts: ^8.2.0
  flutter_animate: ^4.5.2
  dio: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
flutter_launcher_icons:
  image_path: "assets/images/icon_app.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/icon_app.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/icon_app.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/icon_app.png"
